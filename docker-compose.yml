version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: expense_tracker_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: expensetracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense_tracker_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/expensetracker?schema=public"
      DIRECT_URL: "postgresql://postgres:postgrespassword@postgres:5432/expensetracker?schema=public"
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: "super-secret-jwt-key-change-in-production-min-32-chars"
      JWT_EXPIRES_IN: "7d"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expense_tracker_frontend
    restart: always
    ports:
      - "3000:80"
    environment:
      VITE_API_BASE_URL: "http://localhost:4000/api"
    depends_on:
      - backend

volumes:
  postgres_data:
